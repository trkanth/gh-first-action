name: Full Pipeline

on:
  workflow_dispatch:   # Manual trigger

jobs:

  Test:
    runs-on: ubuntu-latest
    steps:
      - name: Unit Test
        run: echo "Unit test"
      - name: Style Checking
        run: echo "Style Checking"
      - name: Code Quality
        run: echo "Code Quality"
      - name: Code Scanning
        run: echo "Code Scanning"

  Build:
    runs-on: ubuntu-latest
    needs: Test
    steps:
      - name: Build
        run: echo "Build"

  Plan:
    runs-on: ubuntu-latest
    needs: Build
    steps:
      - name: Terraform Plan
        run: echo "TF Plan"

  Deploy DEV:
    runs-on: ubuntu-latest
    needs: Plan
    steps:
      - name: Terraform Apply (Dev)
        run: echo "TF Apply (Dev)"
      - name: Deploy App (Dev)
        run: echo "Deploy App (Dev)"

  service_testing:
    runs-on: ubuntu-latest
    needs: Deploy Dev
    steps:
      - name: Service Testing
        run: echo "Service Testing"

  approval:
    runs-on: ubuntu-latest
    needs: service_testing
    environment: qa-approval   # This enables a manual approval in GitHub
    steps:
      - name: Waiting for QA Approval
        run: echo "QA Approval Granted"

  deploy_qa:
    runs-on: ubuntu-latest
    needs: approval
    steps:
      - name: Terraform Apply (QA)
        run: echo "TF Apply (QA)"
      - name: Deploy App (QA)
        run: echo "Deploy App (QA)"
