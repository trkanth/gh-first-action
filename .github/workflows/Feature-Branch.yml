name: Full Pipeline

on:
  workflow_dispatch:   # Manual trigger

jobs:

  Test:
    runs-on: ubuntu-latest
    steps:
      - name: Unit Test
        run: echo "Unit test"
      - name: Style Checking
        run: echo "Style Checking"
      - name: Code Quality
        run: echo "Code Quality"
      - name: Code Scanning
        run: echo "Code Scanning"

  Build:
    runs-on: ubuntu-latest
    needs: Test
    steps:
      - name: Build
        run: echo "Build"

  Plan:
    runs-on: ubuntu-latest
    needs: Build
    steps:
      - name: Terraform Plan
        run: echo "TF Plan"

  Deploy_DEV:
    runs-on: ubuntu-latest
    needs: Plan
    steps:
      - name: Terraform Apply (Dev)
        run: echo "TF Apply (Dev)"
      - name: Deploy App (Dev)
        run: echo "Deploy App (Dev)"

  Service_Testing:
    runs-on: ubuntu-latest
    needs: Deploy_DEV
    steps:
      - name: Service Testing
        run: echo "Service Testing"
