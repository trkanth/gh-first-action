name: Hotfix Pipeline

on:
  workflow_dispatch:   # ⬅ manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build
        run: echo "Build step"

  tf_plan:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Terraform Plan
        run: echo "TF Plan"

  approve_plan:
    needs: tf_plan
    runs-on: ubuntu-latest
    environment:
      name: approval-plan
      url: https://example.com
    steps:
      - name: Waiting for approval
        run: echo "Plan approval granted"

  tf_apply:
    runs-on: ubuntu-latest
    needs: approve_plan
    steps:
      - name: Terraform Apply (PRD)
        run: echo "TF Apply PRD"

  approve_deploy:
    needs: tf_apply
    runs-on: ubuntu-latest
    environment:
      name: approval-deploy
      url: https://example.com
    steps:
      - name: Waiting for deployment approval
        run: echo "Deploy approval granted"

  deploy_app:
    runs-on: ubuntu-latest
    needs: approve_deploy
    steps:
      - name: Deploy App (PRD)
        run: echo "Deploy App PRD"
